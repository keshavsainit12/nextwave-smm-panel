<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Make Payment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    h2 {
      color: #16a34a;
      margin-bottom: 10px;
    }
    p {
      color: #555;
      font-size: 14px;
      margin-bottom: 20px;
    }
    a.pay-btn {
      display: block;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      padding: 14px;
      border-radius: 6px;
      font-size: 16px;
    }
    a.pay-btn:hover {
      background: #1e40af;
    }
    .note {
      margin-top: 12px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Pay Securely</h2>
    <p>Click below to continue to secure payment</p>

    <!-- 🔴 AS-IT-IS PAYMENT LINK (YAHI CHANGE KARNA HAI) -->
    <a
      class="pay-btn"
      href="https://pay.accountpe.in/CLIENT_PAYMENT_LINK"
    >
      Pay Now
    </a>

    <div class="note">
      You will be redirected to a secure payment page
    </div>
  </div>
</body>
</html>
